name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run api:check
      - name: Configure public movie API URL
        env:
          MOVIE_API_URL: ${{ vars.MOVIE_API_URL }}
        run: node scripts/configure-api.cjs
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Angular for the Pages URL
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base-href "${BASE_PATH}/"
      - name: Prepare route entry points
        run: node scripts/prepare-pages.cjs
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/bored-guess-the-movie/browser

  deploy:
    if: ${{ vars.MOVIE_API_URL != '' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
